name: paper-cycle-dashboard

# Runs the AURA v0.5.3 paper chain (.21 -> .12 -> ... -> .19), builds an
# Execution Specification for that cycle (.23), and publishes a read-only
# status dashboard to docs/ (served via GitHub Pages).
#
# IMPORTANT — GitHub limitation, not a bug here: the `schedule` trigger
# below only actually fires from the workflow file version on the
# repository's DEFAULT branch. While this file lives only on
# paper/runtime-alpaca-2026-09-01, the schedule will not run — use
# "Run workflow" (workflow_dispatch, below) from the Actions tab instead,
# selecting this branch. Once this file is merged to main, the schedule
# takes effect automatically.
#
# This workflow never submits a live or paper order. It only runs the
# validation/observation chain and renders whatever it decided. See
# docs/AURA_V0531622_EXECUTION_SPECIFICATION_BRIDGE_2026-09-02.md.

on:
  schedule:
    - cron: "0,30 * * * *" # every 30 minutes; only effective once on the default branch
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: paper-cycle-dashboard
  cancel-in-progress: false

jobs:
  run-cycle-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Run AURA v0.5.3 paper cycle (.21: market data -> .12 -> .19)"
        env:
          ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
        run: python aura_v05321_alpaca_paper_runtime.py --once

      - name: Build Execution Specification (.23) for this cycle
        if: always()
        run: python scripts/run_execution_spec_for_latest_cycle.py
        # No --sizing-config is passed: every symbol fails closed with
        # MISSING_QUANTITY_SOURCE rather than trading a guessed quantity.
        # Add --sizing-config <file> here only after a deliberate,
        # reviewed sizing decision.

      - name: Generate status dashboard
        if: always()
        run: python scripts/generate_status_dashboard.py

      - name: Publish dashboard
        if: always()
        run: |
          git config user.name "aura-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No dashboard changes."
          else
            git commit -m "Update AURA paper-cycle dashboard [skip ci]"
            git push
          fi
